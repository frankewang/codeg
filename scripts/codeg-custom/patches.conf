# codeg 定制文件台账（声明式，脚本按此清单打包替换）
#
# 格式: 目标文件 | 变更说明 | 适用版本 | 场景 | 上游合入探测 | 上游基线blob
#  目标文件   相对仓库根的路径；完整副本在 files/<同路径>（标准 TSX 源码）
#  变更说明   这个文件改了什么、为什么
#  适用版本   >=vX.Y.Z 表示自该上游版本起验证适用（脚本比较当前 codeg 版本）
#  场景       web = server/web 静态前端部署时替换；all = 无条件
#  上游合入探测 若工作区（上游原版）目标文件已含该特征串，说明修复已合入，
#              自动跳过替换（退役）；"-" 表示永不自动退役
#  上游基线blob 制作副本时上游文件的 git blob 哈希；merge 上游后若哈希变化，
#              脚本拒绝替换（防止旧副本覆盖上游新改动），需先重建副本并更新此行。
#              上游没有的新增文件用 "-"。
#
# 上游升级后：正常 git merge 上游 tag 到本分支，再跑一次 apply-patch.sh 即可。
# PR #1142 已合入 v0.48.0：markdown 图片修复与其测试、源码断言测试已退役。
# v0.48.0 起消息面板由上游 useTouchSelectionMenuGuard 负责单指选词复制，
# 我们不再改 conversation-detail-panel.tsx；双指菜单仅保留在侧栏列表。
#
# 注意：tsconfig.build.json 的 exclude 必须包含 scripts/codeg-custom/files，
# 否则 Next 会把副本当源码做类型检查导致构建失败（相对导入在副本目录无效）。
